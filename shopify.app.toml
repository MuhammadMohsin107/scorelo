# Scorelo — Shopify app configuration
#
# Describes the EXISTING "Scorelo" Shopify app. It does not create one.
#
# ─── What this file does ─────────────────────────────────────────────────────
# Scorelo is not a CLI-templated app: no @shopify/* runtime dependency, no App Bridge, no embedded
# admin surface. OAuth is hand-rolled in backend/src/services/shopify-oauth.service.ts, and the
# backend reads its credentials and URLs from backend/.env — never from this file.
#
# So this file has NO runtime effect. It matters only when the Shopify CLI reads it:
# `shopify app config link` pulls the live app's settings down into it, and `shopify app deploy`
# pushes what is written here UP to the real app.
#
# ─── Read before running `shopify app deploy` ────────────────────────────────
# As of CLI 4.x, deploy ALWAYS overwrites the live app's configuration with this file — the old
# opt-out (`include_config_on_deploy`) was removed. Anything configured in the dashboard but
# missing here is wiped.
#
# That is why redirect_urls below lists BOTH origins. Deploying a single-entry list would delete
# the other one and break that environment's OAuth until someone noticed.
#
# Deploy creates a new app version and is roll-back-able from the app's Versions page.

name = "Scorelo"

# PUBLIC identifier — it appears in the browser address bar as ?client_id= during every OAuth
# redirect. Not a secret. SHOPIFY_API_SECRET stays only in backend/.env (git-ignored).
client_id = "b3b946c45888d1581d1b8ba16aa414af"

# Where Shopify sends a merchant who opens the app. Scorelo is a standalone web app, so this is
# the FRONTEND origin, not the API.
application_url = "https://scorelo-staging.tlxapps.com"

# Renders in its own tab, authenticates with a bearer token, redirects to /integrations after
# OAuth. Not framed inside the Shopify admin.
embedded = false

[access_scopes]
# Must stay identical to the SCOPES constant at
# backend/src/services/shopify-oauth.service.ts:41, which documents each one:
#   read_products    product/collection seo{}, descriptionHtml, media alt text, metafields
#   read_content     pages, blogs, articles (implicitly grants read_online_store_pages)
#   read_themes      theme weight / app bloat for the Speed pillar
#   read_metaobjects metaobject instances for Content + AI Discovery
#   read_legal_policies shop policies (refund/shipping/privacy) for the CRO returns check —
#                    shopPolicies used to fall under read_content and now needs its own scope
# read_orders and read_customers are deliberately absent — Protected Customer Data, and no
# Scorelo check reads an order or a customer.
scopes = "read_products,read_content,read_themes,read_metaobjects,read_legal_policies"

# REQUIRED. Scorelo drives the classic authorization-code grant itself (buildInstallUrl →
# /admin/oauth/authorize → exchangeCodeForToken). Shopify's managed install would finish the
# install without ever handing Scorelo the `code`, so handleShopifyCallback would never run and
# no access token would ever be stored.
use_legacy_install_flow = false

[auth]
# Each entry must match redirectUri in buildInstallUrl() exactly, for the BACKEND_URL that
# environment runs with:
#   new URL('/api/shopify/callback', env.backendUrl)   [shopify-oauth.service.ts:67]
# Route defined at backend/src/routes/shopify.ts:30.
#
# Both are listed so one deployed config serves staging and local development. Shopify accepts
# http://localhost redirect URLs for development, and the callback is a redirect of the
# merchant's own browser — which is on the developer's machine — so local OAuth needs no tunnel.
redirect_urls = [
  "https://scorelo-staging.tlxapps.com/api/shopify/callback",
  "http://localhost:5000/api/shopify/callback",
]

[webhooks]
# Pinned to SHOPIFY_API_VERSION at
# backend/src/audit-engine/store-data/shopify-client.ts:11. Keep in step — a version skew here
# silently changes payload shapes.
api_version = "2026-07"

  # Registered programmatically at install time by registerAppUninstalledWebhook()
  # (backend/src/services/shopify-webhook.service.ts:37), which builds its callbackUrl from
  # BACKEND_URL. Declared here so the CLI-managed config matches what the code registers.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://scorelo-staging.tlxapps.com/api/shopify/webhooks/app-uninstalled"

  # The three mandatory GDPR endpoints. Handlers at backend/src/routes/shopify.ts:39-41, verified
  # by per-request HMAC rather than a session. Shopify calls these from its OWN servers, so they
  # must stay on a public https origin — localhost can never receive them.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://scorelo-staging.tlxapps.com/api/shopify/webhooks/customers-data-request"
  customer_deletion_url = "https://scorelo-staging.tlxapps.com/api/shopify/webhooks/customers-redact"
  shop_deletion_url = "https://scorelo-staging.tlxapps.com/api/shopify/webhooks/shop-redact"
